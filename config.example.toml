# web-widow configuration — every value shown is the built-in default.
#
# Only two settings widen what the tool may reach, and both live here:
# fetch.allow_hosts private/LAN hosts and CIDRs (each match is logged)
# robots.enabled set false to disable robots.txt enforcement (logged loudly)
# Neither is exposed as a tool argument, environment variable or CLI flag.
#
# HTTP transport (build with --features http): the bearer token is NOT a config
# value. Set WEB_WIDOW_HTTP_TOKEN or pass --http-token-file <0600 file>; see
# docs/operations.md. The default build is stdio-only.

[fetch]
# Becomes part of the User-Agent: "web-widow/<version> (+<contact>)".
contact = "crawler@example.com"
# Exact hostnames or CIDRs allowed past the private-address gate.
allow_hosts = []
connect_timeout_ms = 10_000
read_timeout_ms = 15_000
total_timeout_ms = 30_000
max_redirects = 5
max_body_bytes = 10_485_760
max_header_bytes = 65_536
min_interval_ms = 1_000
jitter_ms = 500
max_concurrent_per_host = 1
retries_retry_after = 2
retries_5xx = 1
max_retry_after_s = 60

[robots]
enabled = true
user_agent = "web-widow"
max_body_bytes = 524_288
success_ttl_s = 86_400
failure_ttl_s = 3_600

[extract]
default_mode = "main"
max_chars = 200_000
max_links = 2_000
# Safety ceiling for records returned by `extract` (a spec cannot raise it).
max_records = 5_000
# Per-string-value cap for `extract`; per-call values can lower it only.
max_field_chars = 16_384
# How long `extract` with `use_cache: true` may answer without revalidating.
# 0 always revalidates (a 304 still reuses the stored extraction).
cache_freshness_s = 300

[feed]
# fetch_feed defaults and caps (). default_limit <= max_limit <= 100.
default_limit = 20
max_limit = 100
# Plain-text summary/description cap; cuts are counted in truncated_summaries.
max_summary_chars = 2_000

[sitemap]
# `sitemap` / `crawl_start.sitemap_urls` ceilings ().
# Fetched body cap (1..=64 MiB); a gzip body is decompressed only up to 4× this.
max_bytes = 20_971_520
# URL entries kept per document (1..=50 000) and index children fetched (1..=10).
max_urls = 5_000
max_children = 5

[pdf]
# `pdf_extract` ceilings and the native PDFium engine ().
# Strict path to libpdfium.so: when set, exactly this file is loaded and a
# failure is render_unavailable naming the key; there is no fallback.
# pdfium_path = "/usr/local/lib/web-widow/libpdfium.so"
# When pdfium_path is unset, search WEB_WIDOW_PDFIUM_PATH, <exe dir>,
# <data dir>/lib, then the system library.
pdfium_discovery = true
# Fetched body cap (1..=64 MiB) and per-call page/character ceilings.
max_bytes = 33_554_432
max_pages = 200
max_chars = 1_000_000

[events]
# Change feed (events tool + the loopback GET route).
# Serve GET /feeds/changes.xml on the loopback HTTP listener (false -> 404).
feed_enabled = true
# Feed item cap (1..=200); the RSS document itself never exceeds 100.
feed_items = 100

[search]
# DuckDuckGo endpoints. Both are Url-validated at config load; a re-pointed
# endpoint that serves different markup yields extraction_failed, never a new
# engine. html is primary; lite is used only on a transport/parse failure.
html_url = "https://html.duckduckgo.com/html/"
lite_url = "https://lite.duckduckgo.com/lite/"
# Results returned when the caller omits `limit` (1..=10; ten is the SERP cap).
default_limit = 10
# Hard query-length ceiling; an over-length query is schema_invalid.
max_query_chars = 512

[fts]
# Local full-text index over stored pages and the `search_content` tool.
# Indexed body cap per page (chars); the title is always indexed whole. The
# indexed text lives in the database, not the blob budget: lower this on a
# high-volume store.
max_index_chars = 50_000
# Query ceiling; a longer or blank query is schema_invalid.
max_query_chars = 512
# Results returned when the caller omits `limit`; default_limit <= max_limit.
default_limit = 20
max_limit = 100
# Plain snippet cap (chars), applied to the stored body context.
max_snippet_chars = 320

[render]
# Explicit Chrome/Chromium executable. Recommended because the Playwright cache
# is tool-managed and may be pruned. Config file only; never a tool argument.
# chrome_path = "/usr/bin/chromium"
# When chrome_path is unset, also check $CHROME_PATH and well-known locations.
discovery = true
# Concurrent rendered pages (one shared browser, one ephemeral context per page).
max_concurrent_pages = 2
# Wait this long after the load event for network quiet.
settle_ms = 500
# Hard ceiling; the current DOM is returned as rendered_partial when it fires.
ceiling_ms = 10_000
# Per-page transferred bytes and request count. Blocked resources do not count.
max_bytes = 5_242_880
max_requests = 200
# Browser restarts allowed inside the window, then render_unavailable.
restart_max = 3
restart_window_s = 600
launch_timeout_ms = 20_000
# Visual capture profile (screenshot): stylesheets, fonts and images are allowed
# so the image matches what a user sees; media stays blocked. These caps bound
# that capture only. The text profile keeps max_bytes/max_requests above.
visual_max_bytes = 20_971_520
visual_max_requests = 500
# Largest PNG a screenshot may store. Checked before the CAS write: an over-size
# capture is a typed too_large and leaves no blob or row.
max_screenshot_bytes = 33_554_432

[interaction]
# One held browser page per process (`interact_*`). Idle TTL in seconds
# (30..=600); the hard lifetime is 900 s and the action ceiling is 60.
ttl_s = 120
max_actions = 60

[storage]
# Defaults to $XDG_DATA_HOME/web-widow when unset. Must be 0700.
# data_dir = "/home/you/.local/share/web-widow"

[crawl]
# Server ceilings for a crawl job; a job's own `limits` may lower these only.
max_pages = 5_000
max_depth = 5
max_duration_s = 1_800
default_per_host_rate = 1.0
# Lease for a frontier row; a killed process's rows are requeued after this.
lease_s = 30
max_attempts = 3
max_error_samples = 5
result_limit_default = 50
result_limit_max = 500
idle_poll_ms = 250

[monitor]
# Default and bounds for monitor_create.interval_s.
default_interval_s = 86_400
min_interval_s = 60
max_interval_s = 2_592_000
# Unified diff cap; stats always carry full counts.
max_diff_bytes = 20_480
# Whitespace-only change threshold (a changed word is substantive regardless).
cosmetic_max_changed_lines = 2
max_ignore_selectors = 32
max_checks_per_call = 500
changes_limit_default = 50
changes_limit_max = 500
# Upper bound for monitor_check.wait_ms (0 = enqueue and return immediately).
max_wait_ms = 30_000

[logging]
level = "info"
json = false
redact_query = true

[retention]
fetch_events_days = 30
extractions_days = 30
# Disposable screenshot rows (and then their blobs) age out this many days.
screenshots_days = 30
# Delivered webhook rows age out this many days; dead letters use the longer
# webhook_dead_days window. Pending rows are never pruned.
webhook_deliveries_days = 30
webhook_dead_days = 90
# Non-change-point snapshots kept per monitor; change points always stay.
snapshots_per_monitor = 20
max_blob_bytes = 21_474_836_480

[embeddings]
# E1 — local semantic index. `serve` loads the provisioned ONNX Runtime
# library + pinned model files when enabled and runs the bounded lazy backfill;
# `search_semantic` and `embedding_status` read the result. No network access.
enabled = false
model = "minilm-l6-v2-q"
# model_dir = "/abs/path" # default: <data_dir>/models/<model>
# ort_dylib_path = "/abs/path" # unset: discovery (E1)
chunk_chars = 900
chunk_overlap = 120
max_chunks_per_page = 60
max_source_chars = 60_000
backfill_pages_per_pass = 20
backfill_interval_ms = 30_000
query_max_chars = 512

[webhooks]
# W1 — deliberate outbound change notifications. `serve` runs the
# dispatcher when enabled; local `run-due` performs one bounded flush. A check
# only inserts an outbox row. Targets exist ONLY here as named entries; tools
# and monitors attach names, never URLs. The URL is treated as a secret: it is
# never logged or returned (status shows the host only).
enabled = false
timeout_ms = 5_000
max_attempts = 5
# Permit http:// targets for loopback/test receivers only.
allow_http = false
# [webhooks.targets.<name>]
# name: ^[a-z0-9][a-z0-9_-]{0,31}$
# url = "https://..." # https unless allow_http; no userinfo
# kind = "generic" # generic | slack | discord
# secret_env = "VAR" # at most one of secret_env/secret_file
# auth_env = "VAR" # at most one of auth_env/auth_file
# include_diff = false # operator opt-in; diff is omitted by default

[scheduler]
# S1 — opt-in in-process timer (amended). `serve` checks
# due monitors on this tick via the same run_due pass; `run-due` is unchanged.
# Enabling the timer means removing/disabling any cron run-due for the instance.
enabled = false
tick_ms = 30_000
max_checks_per_tick = 25

[http]
# TLS on the same loopback listener (strict either-or). With `tls = true`
# the listener is HTTPS only; generated material lives under <data>/tls/ and the
# operator imports ca.pem once per client. An operator PEM pair overrides the
# generated set (both paths or neither); it is never mixed with generation.
tls = false
# tls_cert_file = "/abs/path/cert.pem" # PEM chain, leaf first
# tls_key_file = "/abs/path/key.pem" # PEM private key, mode 0600

# [auth] — auth-crawl v1: config-named credentials. References live only in
# this 0600 file; an agent names a profile on `fetch_page` and never supplies a
# reference or a value. An authenticated fetch is return-only (no cache, no
# rows, no blobs, no events) and records one value-free auth_audit row per
# attempt. Commented out because every value shown here is the built-in default.
#
# [auth]
# audit_days = 90 # auth_audit retention, 1..=3650
# manager_timeout_ms = 5000 # hard per-resolution timeout, 100..=60000
# allow_loopback_http = false # plain HTTP for literal loopback addresses only
# persist = false # store authenticated bodies ( stays return-only)
# index_authenticated = false # include them in local search + embeddings
# events_authenticated = false # include events derived from them in the feed
# page_retention_days = 7 # shorter retention for stored authenticated pages
#
# [auth.managers.op] # every declared manager is validated at load
# path = "/usr/bin/op" # absolute, existing, executable; PATH never searched
# env_allow = ["OP_SERVICE_ACCOUNT_TOKEN"]
# # names only; values come from the service env.
# # HOME (when set) is passed; PATH and WEB_WIDOW_* are refused.
#
# [auth.managers.bw]
# path = "/usr/bin/bw"
# env_allow = ["BW_SESSION"]
#
# [auth.managers.pass]
# path = "/usr/bin/pass"
# env_allow = []
#
# [auth.profiles.github] # bearer (default), basic or header
# kind = "bearer"
# host = "github.com" # lowercase bare host; no scheme, port or path
# port = 443 # exact credential origin port, 1..=65535 (default 443)
# reference = "op://Private/github/token" # op://<vault>/<item>/<field>
# allow_subdomains = false # reachability only; a credential stays exact-origin
#
# [auth.profiles.legacy]
# kind = "basic"
# host = "legacy.example.com"
# username_reference = "op://Private/legacy/username" # a reference, never a literal
# password_reference = "op://Private/legacy/password"
#
# [auth.profiles.github-session] # kind = "session": operator-driven login + sealed jar
# kind = "session"
# host = "github.com" # binding host; capture seals this exact host only
# port = 443
# login_url = "https://github.com/login"
# login_origins = ["github.com"] # exact hosts the login window may visit (must include host)
# verify_url = "https://github.com/" # https on the binding host; 2xx before sealing
# assets = ["github.githubassets.com"]
# session_max_age_days = 30
#
# [auth.profiles.internal]
# kind = "header"
# host = "internal.example.com"
# header = "X-Api-Key" # Host/Cookie/Content-Length/Proxy-* are refused
# reference = "op://Private/internal/key"
