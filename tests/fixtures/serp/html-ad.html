<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DuckDuckGo</title></head>
<body>
<div class="serp__results">
  <div id="links" class="results">
    <div class="result results_links results_links_deep web-result">
      <div class="links_main links_deep result__body">
        <h2 class="result__title">
          <a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Forg.example%2Forganic-before&amp;rut=aaaa">Organic result before the ad</a>
        </h2>
        <a class="result__snippet" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Forg.example%2Forganic-before&amp;rut=aaaa">The first organic snippet that must survive the ad exclusion.</a>
      </div>
    </div>
    <div class="result results_links results_links_deep result--ad">
      <div class="links_main links_deep result__body">
        <h2 class="result__title">
          <a rel="nofollow" class="result__a" href="//duckduckgo.com/y.js?ad_domain=sponsor.example&amp;u3=https%3A%2F%2Fsponsor.example%2Fpaid">Sponsored placement title</a>
        </h2>
        <a class="result__snippet" href="//duckduckgo.com/y.js?ad_domain=sponsor.example">Paid placement snippet that must never appear.</a>
      </div>
    </div>
    <div class="result results_links results_links_deep web-result">
      <div class="links_main links_deep result__body">
        <h2 class="result__title">
          <a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Forg.example%2Forganic-after&amp;rut=bbbb">Organic result after the ad</a>
        </h2>
        <a class="result__snippet" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Forg.example%2Forganic-after&amp;rut=bbbb">The second organic snippet adjacent to the sponsored block.</a>
      </div>
    </div>
  </div>
</div>
</body></html>
