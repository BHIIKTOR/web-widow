[package]
name = "web-widow"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Agent-native web crawler exposed as an MCP server"
license = "MIT"
publish = false

[features]
# Test-harness only: adds a permissive `AuthEgressPolicy` constructor so a
# policy-inversion drill can prove the gate's policy is the control. Off in
# every shipped build; adds no dependency.
gate-drill = []
# JavaScript rendering. Enabled by default so the
# ordinary `web-widow` binary can render; `--no-default-features` produces the
# static-only build that must keep working without Chrome or CDP.
default = ["render"]
render = ["dep:chromiumoxide", "dep:futures-util"]
# Loopback streamable HTTP transport, and the v0.8 local-TLS listener. The TLS dependencies are only compiled with
# this feature; the stdio and static-only builds stay unchanged.
http = [
    "dep:axum",
    "dep:rcgen",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:hyper",
    "dep:hyper-util",
    "dep:time",
    "rmcp/transport-streamable-http-server",
]

[lib]
name = "web_widow"
path = "src/lib.rs"

[[bin]]
name = "web-widow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", optional = true }
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
base64 = "0.23"
# Session envelope AEAD (XChaCha20-Poly1305) and the OS keyring for the data key.
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ego-tree = "0.11.1"
dom_smoothie = "0.18.2"
encoding_rs = "0.8.42"
# Local embedding inference. `load-dynamic` only:
# no build-time download, no hf-hub/ureq/native-tls, no image models.
fastembed = { version = "=7.5.0", default-features = false, features = ["ort-load-dynamic"] }
# RSS/Atom/JSON Feed parsing. `sanitize` (ammonia) stays off:
# summaries are converted to plain text, never served back as markup.
feed-rs = "3.0.0"
flate2 = "1.1.10"
fs4 = "1.1.0"
htmd = "0.5.6"
ipnet = "2.12.2"
pdfium-render = { version = "0.9.5", features = ["pdfium_8125"] }
jsonschema = { version = "0.60.1", default-features = false }
# ONNX Runtime binding used by fastembed; same package/version, load-dynamic.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
psl = "2.1.245"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "gzip",
    "brotli",
    "deflate",
    "charset",
    "stream",
    "hickory-dns",
] }
# HMAC-SHA256 for webhook signing; already in the lock via rustls.
ring = "0.17.14"
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io", "macros"] }
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 only for the pinned model-artifact provenance check.
sha2 = { version = "0.11.1", default-features = false, features = ["alloc"] }
similar = "3.2.1"
texting_robots = "0.2.2"
thiserror = "2.0.21"
zeroize = "1.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "fs", "signal", "macros", "io-util", "process"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7"] }
chromiumoxide = { version = "0.9.1", default-features = false, optional = true }
futures-util = { version = "0.3.31", default-features = false, features = ["std"], optional = true }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12", "aws_lc_rs"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "tls12", "std"], optional = true }
rustls-pki-types = { version = "1.15.1", features = ["std"], optional = true }
time = { version = "0.3.53", default-features = false, features = ["std"], optional = true }
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1.21", default-features = false, features = ["service", "server-graceful", "tokio"], optional = true }

[dev-dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.7.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "test-util"] }
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

